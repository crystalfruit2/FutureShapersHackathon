[package]
name = "pico_firmware"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pico_firmware"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# Embassy
embassy-executor = { version = "0.10", features = ["defmt", "platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10.0", features = ["rp2040", "defmt", "critical-section-impl", "time-driver"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embassy-dht-sensor = { version = "0.2.9", default-features = false, features = ["dht1x", "rp_no_pio", "rp2040"] }
embassy-net = { version = "0.9.1", features = ["tcp", "proto-ipv4", "medium-ethernet", "dhcpv4"] }
cyw43 = "0.7.0"
cyw43-pio = "0.10.0"

static_cell = "2.1.1"

portable-atomic = { version = "1", features = ["critical-section"] }
critical-section = "1.1"

# Logs & panic
defmt = "1.1.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# Cortex-M
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"

# Disply driver
hd44780-driver = "0.4.0"
heapless = "0.9.3"
embedded-io-async = "0.7.0"
