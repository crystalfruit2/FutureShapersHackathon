[package]
name = "pico_firmware"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rp-pico-2w"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# Embassy
embassy-executor = { version = "0.10", features = ["defmt", "platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10.0", features = ["rp235xa", "defmt", "critical-section-impl", "time-driver"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }

# Logs & panic
defmt = "1.1.1"
defmt-rtt = "1.3.0"
panic-probe = "1.0.0"

# Cortex-M
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
